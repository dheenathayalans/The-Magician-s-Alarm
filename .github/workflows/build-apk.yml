name: Build Magicians Alarm APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Auto-populate App Icons into Assets
      run: |
        mkdir -p android-project/app/src/main/assets
        cp android-project/app/src/main/res/drawable/ic_launcher.png android-project/app/src/main/assets/icon-192.png || true
        cp android-project/app/src/main/res/drawable/ic_launcher.png android-project/app/src/main/assets/logo.png || true
        cp android-project/app/src/main/res/drawable/ic_launcher.png android-project/app/src/main/assets/favicon.png || true

    - name: Accept Android SDK Licenses
      run: |
        yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.4'
        cache-disabled: true

    - name: Restore Permanent Release Keystore
      run: |
        echo "" | base64 -d > android-project/app/release.keystore

    - name: Build APK and Play Store AAB Bundle
      working-directory: android-project
      run: |
        gradle bundleRelease assembleDebug --stacktrace
        find . -name "*.aab"
        find . -name "*.apk"

    - name: Upload Play Store AAB Bundle
      uses: actions/upload-artifact@v4
      with:
        name: magicians-alarm-playstore-aab
        path: '**/build/outputs/bundle/release/*.aab'

    - name: Upload Test APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: magicians-alarm-debug-apk
        path: '**/*.apk'

apply plugin: 'com.android.application'

android {
    namespace 'com.magiciansalarm.app'
    compileSdkVersion 34

    defaultConfig {
        applicationId "com.magiciansalarm.app"
        minSdkVersion 21
        targetSdkVersion 34
        versionCode 1
        versionName "1.0.0"
    }

    signingConfigs {
        release {
            if (file('release.keystore').exists()) {
                storeFile file('release.keystore')
                storePassword 'magiciansalarm123'
                keyAlias 'upload'
                keyPassword 'magiciansalarm123'
            }
        }
    }

    buildTypes {
        release {
            if (file('release.keystore').exists()) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
